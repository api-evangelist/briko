name: Briko Robotics
description: 'Briko Robotics (Briko Robotica) was a Mexican educational technology
  startup founded in 2014 in San Luis Potosi, Mexico, that sold a modular programmable
  electronics kit paired with an online learning platform teaching robotics and programming
  to children from roughly age eight. The company was accelerated by 500 Startups
  LatAm (batch 7) and raised a small seed amount. Third-party company databases now
  classify Briko Robotics as deadpooled, and its former domain brikorobotics.com has
  been hijacked and serves unrelated SEO spam. No developer portal, documentation,
  API, or machine-readable specification was ever published, so this profile carries
  identity and provenance only.'
